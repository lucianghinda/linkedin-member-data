inherit_gem: { quality_gate: config/ruby.yml }

inherit_mode: { merge: [Exclude] }

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "docs/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Tests use compact class names like LinkedIn::MemberData::FooTest.
Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

# Size limits apply to library code. Tests and example scripts are long by nature.
Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"
Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    - "examples/**/*"
Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    - "examples/**/*"

# Keyword arguments document themselves, so they do not count.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Reek rejects one-letter names, so use the same name in both tools.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# enable_changelog! returns true and keeps its bang: it changes state on the server.
Naming/PredicateMethod:
  AllowedMethods:
    - "enable_changelog!"
